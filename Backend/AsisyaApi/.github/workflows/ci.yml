name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore AsisyaApi.sln
      - run: dotnet build AsisyaApi.sln --configuration Release --no-restore
      - run: dotnet test AsisyaApi.sln --configuration Release --no-build
      - run: docker build -t asisya-api .
