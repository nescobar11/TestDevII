services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asisya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d asisya"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=asisya;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Development
    ports: ["8080:8080"]

  # <-- AGREGAR ESTE BLOQUE
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data: